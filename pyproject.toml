[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwatch"
version = "0.1.0"
description = "Supervise one long-running CLI agent process: detect stalls by log mtime, warn, kill, or restart with backoff, log every event as JSONL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abhay Mettu" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["supervisor", "process", "watchdog", "stall", "restart", "cli", "agent"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/abhaymettu/agentwatch"
Issues = "https://github.com/abhaymettu/agentwatch/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
agentwatch = "agentwatch:main"

[tool.setuptools]
py-modules = ["agentwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
